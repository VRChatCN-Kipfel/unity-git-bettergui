name: Contribute a one-click ignore template
description: |
  Propose a .gitignore template for the one-click ignore feature. A template is two
  files dropped into Editor/Templates/BuiltIn/ — the second one is optional.
title: "[Template] "
body:
  - type: markdown
    attributes:
      value: |
        A template contribution is **two files (the second optional) dropped into
        `Editor/Templates/BuiltIn/`** — that is the whole format.

        **1. Required — `Editor/Templates/BuiltIn/<id>.gitignore`**
        - plain gitignore text, UTF-8, LF line endings, one trailing newline;
        - `<id>` is lowercase kebab-case, for example `unity-standard`;
        - the **first non-empty line must be a purpose comment**, for example
          `# Unity standard ignores (Library/, Temp/, build outputs, IDE artifacts)`.

        **2. Optional — `Editor/Templates/BuiltIn/<id>.meta.json`** (if you omit it, the
        display name is derived from `<id>` and the description stays empty):

        ```json
        {
          "name": { "zh": "Unity 标准", "en": "Unity Standard" },
          "description": { "zh": "…", "en": "…" },
          "tags": ["unity", "standard"],
          "order": 100
        }
        ```

        Every field is optional. A smaller `order` sorts earlier — built-in templates use
        100, 110, 120, … — and `tags` are short lowercase labels.

        **3. The `.meta` file** is generated by Unity and committed together with the new
        files. Do not hand-write it: if your local Unity has not generated one, say so in
        the pull request and a reviewer will add it.

        Loading priority on the user side: a user-local
        `UserSettings/GitBetterGui/IgnoreTemplates/` copy beats a project-level
        `.gitui-ignore-templates/` copy, which beats the built-in
        `Editor/Templates/BuiltIn/` shipped in the package. On an id clash the
        higher-priority copy wins.

        Write semantics: a missing target `.gitignore` is created; an existing one is
        **merged** by default (only the missing ignore patterns are appended and the
        original content is kept). The user can also pick **overwrite** explicitly in the
        window, which backs the previous file up to `.gitignore.bak` first.

        The laziest path: the tool window can export the current project's `.gitignore` as
        a project-shared template, already in this format (a missing purpose comment is
        added on export). You can file this issue with just the content below and let a
        maintainer land the files.

  - type: input
    id: template_id
    attributes:
      label: Template id
      description: |
        Lowercase kebab-case only, because it becomes the file name
        `Editor/Templates/BuiltIn/<id>.gitignore`. Use short segments, for example
        `unity-standard` or `unity-urp`.
      placeholder: unity-standard
    validations:
      required: true

  - type: input
    id: display_name_zh
    attributes:
      label: Display name (zh)
      description: |
        The Chinese display name written into `name.zh`.
      placeholder: Unity 标准
    validations:
      required: true

  - type: input
    id: display_name_en
    attributes:
      label: Display name (en, optional)
      description: |
        The English display name written into `name.en`. Leave empty to derive it from the id.
      placeholder: Unity Standard
    validations:
      required: false

  - type: textarea
    id: purpose
    attributes:
      label: Purpose and description
      description: |
        What this template is for and when a user should pick it. Please give both a
        Chinese and an English wording — they go into `description.zh` and `description.en`.
      placeholder: |
        zh 用于……；en 用于……
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags (optional)
      description: |
        Short lowercase labels, comma separated, written into `tags`.
      placeholder: unity, standard
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: The gitignore content
      description: |
        The exact file content. The first non-empty line must be the purpose comment.
        Plain gitignore text, UTF-8, LF line endings, one trailing newline.
      render: text
      placeholder: |
        # Unity standard ignores (Library/, Temp/, build outputs, IDE artifacts)
        [Ll]ibrary/
        [Tt]emp/
    validations:
      required: true

  - type: dropdown
    id: verified_locally
    attributes:
      label: Have you verified this template in a local project?
      description: |
        Verification means you applied it from the window and checked the resulting
        `.gitignore` (created when missing, merged when present).
      options:
        - Yes — placed under UserSettings/GitBetterGui/IgnoreTemplates/ and applied it from the window
        - Yes — placed under a project-level .gitui-ignore-templates/ folder and applied it
        - No — not verified yet
    validations:
      required: true

  - type: dropdown
    id: willing_to_pr
    attributes:
      label: Are you willing to open the pull request yourself?
      description: |
        The change is small: add the file, run the smoke command, open the PR with the
        templates change type.
      options:
        - Yes — I will open the pull request
        - Yes — but I would like guidance
        - No — a maintainer can take it
    validations:
      required: true
